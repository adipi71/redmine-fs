<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Redmine — Progetti e Issue (jsTree)</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/themes/default/style.min.css">
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 24px;
    background: #f7f8fa;
    color: #1a1d21;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  p.subtitle {
    margin: 0 0 20px;
    color: #666;
    font-size: 13px;
  }
  #toolbar {
    margin-bottom: 12px;
  }
  #toolbar input[type="text"] {
    padding: 6px 10px;
    border: 1px solid #d0d3d8;
    border-radius: 4px;
    width: 280px;
    font-size: 13px;
  }
  #toolbar button {
    padding: 6px 12px;
    border: 1px solid #d0d3d8;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    font-size: 13px;
    margin-left: 6px;
  }
  #toolbar button:hover {
    background: #eef1f4;
  }
  #tree-container {
    background: #fff;
    border: 1px solid #e2e5e9;
    border-radius: 6px;
    padding: 16px;
    max-width: 760px;
  }
  #status {
    font-size: 12px;
    color: #888;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Redmine — Gerarchia Progetti / Issue</h1>
<p class="subtitle">
  Dati caricati da <code>jstree-projects-issues.json</code> —
  cartelle = progetti, file = issue.
</p>

<div id="toolbar">
  <input type="text" id="search-box" placeholder="Cerca progetto o issue…">
  <button id="btn-open-all">Espandi tutto</button>
  <button id="btn-close-all">Comprimi tutto</button>
</div>

<div id="tree-container">
  <div id="tree"></div>
</div>
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
<script>
$(function () {
  var $tree = $('#tree');
  var $status = $('#status');

  $tree.jstree({
    core: {
      data: {
        url: 'jstree-projects-issues.json',
        dataType: 'json'
      },
      themes: { dots: true, icons: true }
    },
    plugins: ['search', 'wholerow']
  });

  $tree.on('loaded.jstree', function (e, data) {
    var count = data.instance.get_json(null, { flat: true }).length;
    $status.text(count + ' nodi caricati.');
  });

  $tree.on('changed.jstree', function (e, data) {
    if (data.selected.length) {
      var node = data.instance.get_node(data.selected[0]);
      $status.text('Selezionato: ' + node.text + '  [id: ' + node.id + ']');
    }
  });

  // Search box (debounced)
  var searchTimeout = false;
  $('#search-box').on('keyup', function () {
    if (searchTimeout) clearTimeout(searchTimeout);
    var q = this.value;
    searchTimeout = setTimeout(function () {
      $tree.jstree('search', q);
    }, 250);
  });

  $('#btn-open-all').on('click', function () {
    $tree.jstree('open_all');
  });
  $('#btn-close-all').on('click', function () {
    $tree.jstree('close_all');
  });
});
</script>

</body>
</html>

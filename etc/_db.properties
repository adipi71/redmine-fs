# Connessione al database PostgreSQL usata da RedmineIssuesExporter.
#
# db.url, se presente, ha priorità e viene usato così com'è (utile per
# parametri extra: sslmode, unix socket, ecc.). In sua assenza l'URL JDBC
# viene composto da db.host/db.port/db.name.
#
# db.url=jdbc:postgresql://localhost:5432/redmine?sslmode=disable

db.host=localhost
db.port=5432
db.name=redmine
db.user=redmine
db.password=
